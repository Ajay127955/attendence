# Render Blueprint — the API + realtime server for the Attendance Management System.
#
# Topology (free tier):
#   Portfolio (Vercel)  : https://codestorm.dpdns.org
#   App SPA (Vercel)    : https://codestorm.dpdns.org/attendence/
#   API + WebSockets    : this service, reached same-origin through the
#                         portfolio's Vercel rewrite at https://codestorm.dpdns.org/ams/*
#   Database            : MongoDB Atlas M0 (free)
#
# The API is proxied by Vercel under /ams/* (see the portfolio's vercel.json),
# so the browser talks to the same origin as the SPA and the login cookie is
# sent normally — no subdomain, and no CORS/cookie workarounds needed. Socket.IO
# works over its polling transport, since Vercel does not forward WebSocket
# upgrades for external rewrites.
#
# How to use:
#   1. Push this repo to GitHub (see DEPLOY.md Step 0).
#   2. Create the free Atlas cluster + database user (DEPLOY.md Step 1).
#   3. Render Dashboard -> New -> Blueprint -> pick this repo.
#      Render reads this file, creates the service, and prompts you only for the
#      values marked `sync: false` (the Atlas connection string).
#   4. No custom domain is needed: the portfolio proxies /ams/* to this service.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ams
    runtime: node
    plan: free
    # Closest region to you. Options: oregon | ohio | virginia | frankfurt | singapore.
    # If you're in the US, switch this to oregon/ohio/virginia.
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # --include=dev is REQUIRED: NODE_ENV=production is present during the build,
    # which would otherwise make `npm ci` skip Vite/Tailwind and fail the SPA build.
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production

      # --- Database (set in the Render dashboard; keep secret) ---
      # mongodb+srv://ams_user:<password>@cluster0.xxxxx.mongodb.net/attendance_ams?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false

      # --- Auth secrets (auto-generated once, then kept stable) ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # --- Public app URL + CORS ---
      # The SPA is served by the portfolio (Vercel) at
      # https://codestorm.dpdns.org/attendence/ and reaches this API through the
      # portfolio's same-origin /ams/* rewrite, so proxied requests carry this
      # origin. Requests made directly against this service's own URL are
      # same-origin and therefore need no CORS entry.
      - key: CLIENT_URL
        value: https://codestorm.dpdns.org/attendence
      - key: CORS_ORIGINS
        value: https://codestorm.dpdns.org
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: COOKIE_DOMAIN
        value: ""

      # --- Serve the built SPA from this server at the subdomain root ---
      - key: SERVE_CLIENT
        value: "true"
      - key: CLIENT_BASE_PATH
        value: /
      # Read at BUILD time by Vite, so it must be set before the first build.
      - key: VITE_BASE_PATH
        value: /

      # --- Default password for newly created student accounts ---
      # Used when a student is added without an explicit password, or imported
      # from CSV. Set a strong value in the Render dashboard.
      - key: SEED_STUDENT_PASSWORD
        sync: false

      # --- Optional integrations (leave blank to disable) ---
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"
      - key: GOOGLE_SHEETS_ID
        value: ""
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        value: ""
      - key: GOOGLE_PRIVATE_KEY
        value: ""

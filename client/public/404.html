<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Attendance Management System</title>
    <script>
      // GitHub Pages serves this file for any unknown path. Encode the requested
      // path into a query string so index.html can restore it and React Router
      // can render the right page on a hard refresh / deep link.
      // pathSegmentsToKeep = 1 for a project site at /<repo>/ (e.g. /attendence/).
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
